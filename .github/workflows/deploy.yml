# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Before the first run:
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables, add
#     VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_OWNER_EMAILS
#
# Variables, not Secrets. All three are compiled into the JavaScript bundle
# and are readable by anyone who loads the page, so treating them as secrets
# would be theatre — and masked secrets are miserable to debug. What actually
# guards the data is the row-level security in supabase/schema.sql. ACCESS.md
# explains why the anon key is safe to publish and why the service_role key
# must never come near this file.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Pages serves the site from /<repo>/, not the domain root, so every
          # asset URL needs that prefix. vite.config.js reads BASE_PATH.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_OWNER_EMAILS: ${{ vars.VITE_OWNER_EMAILS }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
